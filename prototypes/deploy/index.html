<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloaked reskin — 20 screen comparison</title>
  <link rel="stylesheet" href="tokens/colors.css" />
  <link rel="stylesheet" href="tokens/numbers.css" />
  <link rel="stylesheet" href="tokens/typography.css" />
  <link rel="stylesheet" href="tokens/themes.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--ct-font-sans);
      background: #e9e6dc;
      color: var(--ct-text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page-header {
      padding: var(--ct-spacing-32) var(--ct-spacing-40) var(--ct-spacing-16);
      display: flex;
      align-items: baseline;
      gap: var(--ct-spacing-16);
      flex-wrap: wrap;
    }
    .page-header h1 {
      font-family: var(--ct-text-h2-serif-family);
      font-weight: var(--ct-text-h2-serif-weight);
      font-size: var(--ct-text-h2-serif-size);
      line-height: var(--ct-text-h2-serif-line-height);
      letter-spacing: var(--ct-text-h2-serif-letter-spacing);
      margin: 0;
      color: var(--ct-text-primary);
    }
    .page-header .subtitle {
      font-family: var(--ct-font-sans);
      font-size: 14px;
      color: var(--ct-text-secondary);
    }

    .tab-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #e9e6dc;
      padding: var(--ct-spacing-8) var(--ct-spacing-40);
      border-bottom: 1px solid var(--ct-divider);
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { height: 6px; }
    .tab-bar::-webkit-scrollbar-thumb { background: var(--ct-color-grey-02); border-radius: 999px; }

    .tab-bar button {
      font: inherit;
      font-size: 13px;
      color: var(--ct-text-secondary);
      background: transparent;
      border: none;
      padding: var(--ct-spacing-8) var(--ct-spacing-12);
      cursor: pointer;
      border-radius: 999px;
      margin-right: var(--ct-spacing-4);
      transition: background 120ms ease, color 120ms ease;
    }
    .tab-bar button:hover { background: var(--ct-color-black-05); color: var(--ct-text-primary); }
    .tab-bar button[aria-selected="true"] {
      background: var(--ct-color-grey-05);
      color: var(--ct-color-grey-01);
    }

    main { padding: var(--ct-spacing-24) var(--ct-spacing-40) var(--ct-spacing-80); }
    .pane { display: none; }
    .pane[data-active="true"] { display: block; }

    .pane-header {
      display: flex;
      gap: var(--ct-spacing-24);
      margin-bottom: var(--ct-spacing-16);
      align-items: flex-end;
    }
    .pane-header .label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ct-text-secondary);
    }
    .pane-header .label.before { width: 375px; }
    .pane-header .label.after { width: 375px; }

    .pane-row {
      display: flex;
      gap: var(--ct-spacing-24);
      align-items: flex-start;
    }

    .phone {
      width: 375px;
      height: 812px;
      flex: 0 0 375px;
      background: var(--ct-bkgd-02);
      border-radius: 32px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      box-shadow: 0 1px 0 var(--ct-color-black-05), 0 12px 32px rgba(0,0,0,0.06);
      scrollbar-width: thin;
      scrollbar-color: var(--ct-color-grey-02) transparent;
    }
    .phone::-webkit-scrollbar { width: 6px; }
    .phone::-webkit-scrollbar-thumb { background: var(--ct-color-grey-02); border-radius: 999px; }
    .phone::-webkit-scrollbar-track { background: transparent; }
    .phone--before { background: var(--ct-color-white); }
    .phone--before img { display: block; width: 100%; height: auto; }

    .reskin {
      background: var(--ct-bkgd-01);
      min-height: 100%;
      font-family: var(--ct-font-sans);
      color: var(--ct-text-primary);
      display: flex;
      flex-direction: column;
    }
    .reskin .safe-top { height: var(--ct-spacing-40); flex: 0 0 auto; }

    .reskin .page-bar {
      background: var(--ct-bkgd-02);
      padding: 0 var(--ct-spacing-20) var(--ct-spacing-16);
      display: flex;
      align-items: center;
      gap: var(--ct-spacing-12);
      min-height: 56px;
    }
    .reskin .page-bar .title {
      font-family: var(--ct-text-h2-serif-family);
      font-weight: var(--ct-text-h2-serif-weight);
      font-size: var(--ct-text-h2-serif-size);
      line-height: var(--ct-text-h2-serif-line-height);
      letter-spacing: var(--ct-text-h2-serif-letter-spacing);
      color: var(--ct-text-primary);
      flex: 1 1 auto;
      text-transform: lowercase;
    }
    .reskin .page-bar .icon-btn {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ct-text-primary);
      cursor: default;
    }

    .sheet {
      background: var(--ct-bkgd-02);
      padding: var(--ct-spacing-20);
    }
    .sheet + .sheet { margin-top: 1px; }
    .sheet--flush { padding: 0; }

    .section-title {
      font-family: var(--ct-text-h3-family);
      font-weight: var(--ct-text-h3-weight);
      font-size: var(--ct-text-h3-size);
      line-height: var(--ct-text-h3-line-height);
      letter-spacing: var(--ct-text-h3-letter-spacing);
      text-transform: capitalize;
      color: var(--ct-text-primary);
      margin: 0 0 var(--ct-spacing-4);
    }
    .section-sub {
      font-size: 14px;
      color: var(--ct-text-secondary);
      margin: 0 0 var(--ct-spacing-16);
    }

    .row {
      display: flex;
      align-items: center;
      gap: var(--ct-spacing-12);
      padding: var(--ct-spacing-16) 0;
      border-top: 1px solid var(--ct-divider);
    }
    .row:first-of-type { border-top: 0; }
    .row .avatar {
      width: 32px; height: 32px;
      border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: var(--ct-color-white);
      flex: 0 0 auto;
      overflow: hidden;
    }
    .row .body { flex: 1 1 auto; min-width: 0; }
    .row .body .label { font-size: 16px; color: var(--ct-text-primary); }
    .row .body .meta { font-size: 14px; color: var(--ct-text-secondary); }
    .row .right { font-size: 14px; color: var(--ct-text-secondary); flex: 0 0 auto; }

    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%;
      padding: var(--ct-spacing-16) var(--ct-spacing-24);
      background: var(--ct-cta-primary-container);
      color: var(--ct-cta-primary-text);
      border-radius: 999px;
      font-size: 16px;
      border: none;
      cursor: default;
    }
    .cta--secondary { background: var(--ct-cta-secondary-container); color: var(--ct-cta-secondary-text); }
    .cta--brand { background: var(--ct-brand); color: var(--ct-color-white); }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--ct-color-black-05);
      color: var(--ct-text-primary);
    }
    .pill--success { background: var(--ct-status-success-subtle); color: var(--ct-status-success-solid); }
    .pill--fail { background: var(--ct-status-fail-subtle); color: var(--ct-status-fail-solid); }

    .nav-bottom {
      background: var(--ct-bkgd-02);
      border-top: 1px solid var(--ct-divider);
      padding: var(--ct-spacing-12) var(--ct-spacing-16) var(--ct-spacing-24);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-top: auto;
    }
    .nav-bottom .item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px;
      color: var(--ct-text-secondary);
      padding: 6px 2px;
      border-radius: 12px;
    }
    .nav-bottom .item.active { color: var(--ct-text-primary); background: var(--ct-color-black-05); }
    .nav-bottom .item svg { display: block; }

    .chips { display: flex; gap: var(--ct-spacing-8); flex-wrap: wrap; }
    .chip {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 14px;
      background: var(--ct-color-black-05);
      color: var(--ct-text-primary);
    }
    .chip.active {
      background: var(--ct-cta-primary-container);
      color: var(--ct-cta-primary-text);
    }

    .search {
      display: flex; align-items: center; gap: var(--ct-spacing-8);
      background: var(--ct-color-black-05);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--ct-text-secondary);
      font-size: 14px;
    }
    .search input {
      flex: 1; background: transparent; border: none; outline: none;
      font: inherit; color: var(--ct-text-primary);
    }

    .avt-warby { background: #2da9ff; }
    .avt-twitch { background: #9146FF; }
    .avt-airbnb { background: #FF5A5F; }
    .avt-spotify { background: #1DB954; }
    .avt-amazon { background: #FF9900; }
    .avt-instagram { background: linear-gradient(135deg, #fdf497, #fd5949 45%, #d6249f 70%, #285AEB); }
    .avt-target { background: #CC0000; }
    .avt-dashlane { background: #0E2C38; }
    .avt-zillow { background: #006AFF; }
    .avt-starbucks { background: #006241; }
    .avt-southwest { background: #304CB2; }
    .avt-bee { background: #46b85a; }
    .avt-cloak-blue { background: linear-gradient(135deg, #2da9ff, #29bee8); }
    .avt-cloak-rose { background: linear-gradient(135deg, #f0536b, #ff85a1); }
    .avt-cloak-violet { background: linear-gradient(135deg, #635ef9, #a474ff); }
    .avt-cloak-green { background: linear-gradient(135deg, #00c49a, #62c081); }
    .avt-cloak-foam { background: linear-gradient(135deg, #29bee8, #6cd3ef); }

    .stack-12 > * + * { margin-top: var(--ct-spacing-12); }
    .stack-16 > * + * { margin-top: var(--ct-spacing-16); }
    .stack-8 > * + * { margin-top: var(--ct-spacing-8); }
    .row-flex { display: flex; align-items: center; gap: var(--ct-spacing-12); }
    .row-flex.between { justify-content: space-between; }
    .num-display {
      font-family: var(--ct-text-display-1-family);
      font-weight: var(--ct-text-display-1-weight);
      font-size: var(--ct-text-display-1-size);
      line-height: var(--ct-text-display-1-line-height);
      letter-spacing: var(--ct-text-display-1-letter-spacing);
      color: var(--ct-text-primary);
    }
    .num-display-2 {
      font-family: var(--ct-text-display-2-family);
      font-weight: var(--ct-text-display-2-weight);
      font-size: var(--ct-text-display-2-size);
      line-height: var(--ct-text-display-2-line-height);
      letter-spacing: var(--ct-text-display-2-letter-spacing);
      color: var(--ct-text-primary);
    }
    .h3 {
      font-family: var(--ct-text-h3-family);
      font-weight: var(--ct-text-h3-weight);
      font-size: var(--ct-text-h3-size);
      line-height: var(--ct-text-h3-line-height);
      letter-spacing: var(--ct-text-h3-letter-spacing);
    }
    .body-small {
      font-size: var(--ct-text-body-small-size);
      line-height: 1.4;
      color: var(--ct-text-secondary);
    }
    .divider { height: 1px; background: var(--ct-divider); border: 0; margin: 0; }

    .fab {
      position: absolute;
      right: 16px; bottom: 96px;
      width: 56px; height: 56px;
      border-radius: 999px;
      background: var(--ct-brand);
      color: var(--ct-color-white);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px;
    }

    .hero-illus {
      height: 180px;
      border-radius: 24px;
      background: radial-gradient(80% 100% at 50% 30%, #ffe2c2 0%, #ffcd9b 60%, #f4a87a 100%);
      display: flex; align-items: center; justify-content: center;
      color: var(--ct-color-grey-05);
    }
    .hero-illus--id { background: radial-gradient(80% 100% at 50% 30%, #cfebff 0%, #9bd1f6 60%, #65a8d8 100%); }
  </style>
</head>
<body>
  <header class="page-header">

  <nav class="tab-bar" role="tablist" id="tabBar">

    <button role="tab" data-tab="settings">Settings</button>
    <button role="tab" data-tab="website">Website</button>

  </nav>

  <main id="paneRoot"></main>

  <script>
    function icon(name) {
      const s = 20;
      const wrap = (content) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;">${content}</svg>`;
      switch (name) {
        case 'menu': return wrap('<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>');
        case 'chevron-left': return wrap('<polyline points="15 18 9 12 15 6"/>');
        case 'close': return wrap('<line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/>');
        case 'search': return wrap('<circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/>');
        case 'sort': return wrap('<polyline points="7 4 7 20"/><polyline points="4 17 7 20 10 17"/><polyline points="17 20 17 4"/><polyline points="14 7 17 4 20 7"/>');
        case 'settings': return wrap('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>');
        case 'info': return wrap('<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="11" x2="12" y2="16"/>');
        case 'image': return wrap('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><polyline points="21 17 16 12 5 21"/>');
        case 'copy': return wrap('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>');
        case 'globe': return wrap('<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>');
        case 'shield': return wrap('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>');
        case 'shield-id': return wrap('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><circle cx="12" cy="11" r="2"/><path d="M9 17a3 3 0 0 1 6 0"/>');
        case 'shield-gem': return wrap('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><circle cx="12" cy="11" r="3"/>');
        case 'lock': return wrap('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');
        case 'key': return wrap('<circle cx="9" cy="14" r="4"/><path d="M13 13l8-8M17 9l3 3"/>');
        case 'phone': return wrap('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.89.72 2.78a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.11-.45c.89.35 1.82.59 2.78.72A2 2 0 0 1 22 16.92z"/>');
        case 'mail': return wrap('<rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/>');
        case 'inbox': return wrap('<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>');
        case 'clock': return wrap('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>');
        case 'sms': return wrap('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>');
        case 'id': return wrap('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 17a3 3 0 0 1 6 0"/><line x1="14" y1="10" x2="18" y2="10"/><line x1="14" y1="14" x2="18" y2="14"/>');
        case 'sim': return wrap('<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 10h6v6H9z"/>');
        case 'check': return wrap('<polyline points="20 6 9 17 4 12"/>');
        case 'card': return wrap('<rect x="3" y="6" width="18" height="12" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/>');
        case 'coin': return wrap('<circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="17"/><path d="M9 9.5C9 8 10 7.5 12 7.5s3 1 3 2.5-1 2-3 2-3 .5-3 2 1 2.5 3 2.5 3-.5 3-2"/>');
        case 'help': return wrap('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/>');
        case 'flag': return wrap('<line x1="5" y1="21" x2="5" y2="3"/><path d="M5 3h12l-2 4 2 4H5"/>');
        case 'logout': return wrap('<path d="M16 17l5-5-5-5"/><line x1="21" y1="12" x2="9" y2="12"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>');
        case 'exposure': return wrap('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>');
        case 'edit': return wrap('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>');
        case 'pause': return wrap('<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>');
        case 'scan': return wrap('<path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/>');
        case 'play': return wrap('<polygon points="8 5 19 12 8 19 8 5" fill="currentColor"/>');

      <div class="sheet"><h3 class="section-title">Stay Safe</h3>${menuRow('id', 'Identity Monitoring', 'Scan the dark web')}${menuRow('lock', 'Password Manager', 'Encrypted login storage')}${menuRow('globe', 'VPN', 'Protect connection privacy')}${menuRow('card', 'Cloaked Pay', 'Cards & spending control', 'New', true)}${menuRow('check', 'Authenticator', 'Temporary passcodes')}${menuRow('sim', 'SafeSIM', 'Your secure secondary SIM')}${menuRow('coin', 'Identity Theft Insurance', '$1M protection')}</div>

    const tabConfig = [
      { tab: 'homepage', key: 'homepage', file: 'Homepage.png' },
      { tab: 'exposure', key: 'exposure', file: 'exposure status.png' },
      { tab: 'automations', key: 'automations', file: 'automations.png' },
      { tab: 'identity-phone', key: 'identity-phone', file: 'identity-phone.png' },
      { tab: 'identity-email', key: 'identity-email', file: 'identity-email.png' },
      { tab: 'identity-inbox', key: 'identity-inbox', file: 'identity-inbox.png' },
      { tab: 'identity-phone-number', key: 'identity-phone-number', file: 'identity-phone number.png' },
      { tab: 'inbox-call-guard', key: 'inbox-call-guard', file: 'inbox-call guard.png' },
      { tab: 'identity-monitoring', key: 'identity-monitoring', file: 'identity monitoring.png' },
      { tab: 'vpn', key: 'vpn', file: 'VPN.png' },
      { tab: 'password-manager', key: 'password-manager', file: 'Password manager.png' },
      { tab: 'spotify-identity', key: 'spotify-identity', file: 'identity-create spotify identity.png' },
      { tab: 'wallet', key: 'wallet', file: 'wallet.png' },
      { tab: 'otp', key: 'otp', file: 'one time passcode.png' },
      { tab: 'esim', key: 'esim', file: 'manage esim.png' },
      { tab: 'id-theft', key: 'id-theft', file: 'identity theft protection.png' },
      { tab: 'settings', key: 'settings', file: 'settings.png' },
      { tab: 'website', key: 'website', file: 'website.png' },
      { tab: 'messages', key: 'messages', file: 'messages.png' },
      { tab: 'menu', key: 'menu', file: 'Menu.png' },
    ];

    const labelMap = {
      'homepage': 'Homepage', 'exposure': 'Exposure status', 'automations': 'Automations',
      'identity-phone': 'Identity · Phone', 'identity-email': 'Identity · Email',
      'identity-inbox': 'Identity · Inbox', 'identity-phone-number': 'Phone number',
      'inbox-call-guard': 'Call Guard', 'identity-monitoring': 'Identity monitoring',
      'vpn': 'VPN', 'password-manager': 'Password manager',
      'spotify-identity': 'Spotify identity', 'wallet': 'Wallet',
      'otp': 'One-time passcode', 'esim': 'Manage eSIM',
      'id-theft': 'Identity theft protection', 'settings': 'Settings',
      'website': 'Website (help.cloaked.app)', 'messages': 'Messages', 'menu': 'Menu',
    };

    const paneRoot = document.getElementById('paneRoot');
    tabConfig.forEach((entry, idx) => {
      const pane = document.createElement('section');
      pane.className = 'pane';
      pane.dataset.pane = entry.tab;
      if (idx === 0) pane.dataset.active = 'true';
      const reskinHTML = reskins[entry.key] || '<div style="padding:32px;color:var(--ct-text-secondary);">Reskin coming soon.</div>';
      pane.innerHTML = `
        <div class="pane-header">
          <span class="label before">Original — ${labelMap[entry.tab]}</span>
          <span class="label after">Reskinned with cloaked-design-md</span>
        </div>
        <div class="pane-row">
          <div class="phone phone--before"><img loading="lazy" src="assets/reskin/${entry.file}" alt="${labelMap[entry.tab]} — original" /></div>
          <div class="phone"><div class="reskin">${reskinHTML}</div></div>
        </div>
      `;
      paneRoot.appendChild(pane);
    });

    const tabBar = document.getElementById('tabBar');
    tabBar.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      const tab = btn.dataset.tab;
      tabBar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'));
      document.querySelectorAll('.pane').forEach(p => {
        if (p.dataset.pane === tab) p.dataset.active = 'true';
        else delete p.dataset.active;
      });
      window.scrollTo({ top: tabBar.getBoundingClientRect().bottom + window.scrollY - 80, behavior: 'smooth' });
    });
  </script>
